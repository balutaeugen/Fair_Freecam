[freecam.config.gui]
title = "Fair Freecam Optionen"

  [freecam.config.gui.fallback]
  title = "Konfigurations-GUI nicht verfügbar."

[freecam.config.controls]
label = "Tastenbelegung"
tooltip = "Fair Freecam Tastenbelegung."

[freecam.config.movement]
label = "Bewegungsoptionen"
tooltip = "Wie sich die Kamera bewegt."

  [freecam.config.movement.flightMode]
  label = "Flugmodus"
  tooltip = "Von Fair Freecam verwendeter Flugtyp."
  DEFAULT = "Standard"
  CREATIVE = "Kreativ"

  [freecam.config.movement.speed]
  value = "Wert: %01.2f"

    [freecam.config.movement.speed.horizontal]
    label = "Horizontale Geschwindigkeit"
    tooltip = "Horizontale Geschwindigkeit von Fair Freecam."

    [freecam.config.movement.speed.vertical]
    label = "Vertikale Geschwindigkeit"
    tooltip = "Die vertikale Geschwindigkeit von freecam."

[freecam.config.visual]
label = "Visuelle Optionen"
tooltip = "Das Aussehen von Fair Freecam."

  [freecam.config.visual.perspective]
  label = "Initiale Perspektive"
  tooltip = "Initiale Perspektive der Kamera."
  FIRST_PERSON = "First Person"
  THIRD_PERSON = "Außenansicht"
  THIRD_PERSON_MIRROR = "Spiegel"
  INSIDE = "Innen"

  [freecam.config.visual.showPlayer]
  label = "Spieler anzeigen"
  tooltip = "Zeigt Ihren Spieler in seiner Originalposition."

  [freecam.config.visual.showHand]
  label = "Hand anzeigen"
  tooltip = "Ob deine Hand in Fair Freecam zu sehen ist."

  [freecam.config.visual.fullBright]
  label = "Volle Helligkeit"
  tooltip = "Erhöht Helligkeit im Fair Freecam."

  [freecam.config.visual.showSubmersionFog]
  label = "Unterwassernebel anzeige"
  tooltip = "Ob du Nebel Unterwasser, in Lava oder in Pulverschnee siehst."

[freecam.config.utility]
label = "Utility Optionen"
tooltip = "Fair Freecam Verbesserungen."

  [freecam.config.utility.disableOnDamage]
  label = "Bei Schaden deaktivieren"
  tooltip = "Deaktiviert Fair Freecam, wenn man Schaden bekommt."

  [freecam.config.utility.freezePlayer]
  label = "Spieler einfrieren"
  "tooltip[0]" = "Verhindert Spieler Bewegung, während Fair Freecam aktiviert ist."
  "tooltip[1]" = "$cWARNUNG: Mehrspielernutzung nicht empfohlen."

[freecam.config.utility.interact.allow]
label = "Interaktion erlauben"
"tooltip[0]" = "Ob du mit Blöcken/Entities im Fair Freecam interagieren kannst."
"tooltip[1]" = "$cWARNUNG: Mehrspielernutzung nicht empfohlen."

[freecam.config.utility.interact.mode]
label = "Interaktionsmodus"
tooltip = "Die Quelle für Block/Entität Interaktionen."
CAMERA = "Kamera"
PLAYER = "Spieler"

[freecam.config.servers]
label = "Mehrspieler Optionen"
tooltip = "Optionen in Bezug auf Mehrspieler Servers."

  [freecam.config.servers.mode]
  label = "Einschränkungsmodus"
  "tooltip[0]" = "Fair Freecam auf bestimmten Servers erlauben oder verbieten."
  "tooltip[1]" = "(entweder eine Whitelist oder Blacklist verwenden)."
  NONE = "Keine Einschränkungen"
  WHITELIST = "Ausnahmeliste"
  BLACKLIST = "Nutzer blocken"

  [freecam.config.servers.whitelist]
  label = "Ausnahmeliste:"

  [freecam.config.servers.blacklist]
  label = "Blacklist:"

[freecam.config.notification]
label = "Benachrichtigungsoptionen"
tooltip = "Benachrichtigungen anzeigen oder verstecken."

  [freecam.config.notification.freecam]
  label = "Fair Freecam Benachrichtigungen"
  tooltip = "Benachrichtigt dich, wenn du freecam betrittst/verlässt."

  [freecam.config.notification.tripod]
  label = "Stativ Benachrichtigungen"
  tooltip = "Benachrichtigt dich, wenn du Stativkameras betrittst/verlässt."
