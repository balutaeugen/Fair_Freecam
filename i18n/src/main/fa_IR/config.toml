[freecam.config.gui]
title = "تنظیمات فری کم"

  [freecam.config.gui.fallback]
  title = "رابط کاربری گرافیکی پیکربندی در دسترس نیست."

[freecam.config.controls]
label = "کلید های میانبر"
tooltip = "کلید های میانبر فری کم."

[freecam.config.movement]
label = "تنظیمات حرکت"
tooltip = "طوری که دوربین حرکت میکند."

  [freecam.config.movement.flightMode]
  label = "حالت پرواز"
  tooltip = "نوع پروازی که توسط فری کم استفاده می شود."
  DEFAULT = "پیشفرض"
  CREATIVE = "حالت خلاق"

  [freecam.config.movement.speed]
  value = "مقدار: %01.2f"

    [freecam.config.movement.speed.horizontal]
    label = "سرعت افقی"
    tooltip = "سرعت افقی فری کم."

    [freecam.config.movement.speed.vertical]
    label = "سرعت عمودی"
    tooltip = "سرعت عمودی فری کم."

[freecam.config.visual]
label = "تنظیمات بصری"
tooltip = "ظاهر فری کم."

  [freecam.config.visual.perspective]
  label = "دید اولیه"
  tooltip = "دید اولیه دوربین."
  FIRST_PERSON = "اول شخص"
  THIRD_PERSON = "سوم شخص"
  THIRD_PERSON_MIRROR = "معکوس کردن"
  INSIDE = "داخل"

  [freecam.config.visual.showPlayer]
  label = "نمایش بازیکن"
  tooltip = "بازیکن را در موقعیت اصلی نشان می دهد."

  [freecam.config.visual.showHand]
  label = "نمایش دست"
  tooltip = "اینکه دست خود را در فری کم ببینید."

  [freecam.config.visual.fullBright]
  label = "روشنایی کامل"
  tooltip = "روشنایی را حین بودن در فری کم افزایش می دهد."

  [freecam.config.visual.showSubmersionFog]
  label = "نمایش مه غوطه وری"
  tooltip = "اینکه شما یک پوششی از مه در زیر آب، گدازه یا برف پودر شده ببینید."

  [freecam.config.visual.outlinePlayer]
  label = "پخش کننده طرح کلی"
  "tooltip[0]" = "هنگام فعال کردن فری کم، یک طرح کلی به پخش‌کننده خود اعمال کنید."
  "tooltip[1]" = 'همچنین می‌توان طرح کلی را با استفاده از کلید ترکیبی "Toggle Player Outline" کنترل کرد.'

[freecam.config.utility]
label = "تنظیمات کاربردی"
tooltip = "بهبود های فری کم."

  [freecam.config.utility.disableOnDamage]
  label = "غیرفعال کردن موقع آسیب دیدن"
  tooltip = "وقتی آسیب میبینید فری کم غیرفعال می شود."

  [freecam.config.utility.freezePlayer]
  label = "تثبیت بازیکن"
  "tooltip[0]" = "وقتی فری کم فعال است از حرکت بازیکن جلوگیری میکند."
  "tooltip[1]" = "§cاخطار: استفاده در چند نفره توصیه نمی شود."

[freecam.config.utility.interact.allow]
label = "اجازه دادن به تعامل"
"tooltip[0]" = "اینکه شما بتوانید با بلاک ها/انتیتی ها در فری کم تعامل کنید."
"tooltip[1]" = "§cاخطار: استفاده در چند نفره توصیه نمی شود."

[freecam.config.utility.interact.mode]
label = "حالت تعامل"
tooltip = "منبع تعامل با بلاک ها/انتیتی ها."
CAMERA = "دوربین"
PLAYER = "بازیکن"

[freecam.config.servers]
label = "تنظیمات چند نفره"
tooltip = "تنظیمات مرتبط با سرور های چند نفره."

  [freecam.config.servers.mode]
  label = "حالت محدودیت"
  "tooltip[0]" = "اجازه یا منع از استفاده فری کم بر بعضی سرور ها."
  "tooltip[1]" = "(با استفاده از لیست منع یا لیست مجاز)."
  NONE = "بدون محدودیت"
  WHITELIST = "لیست مجاز"
  BLACKLIST = "لیست منع"

  [freecam.config.servers.whitelist]
  label = "لیست مجاز:"

  [freecam.config.servers.blacklist]
  label = "لیست منع:"

[freecam.config.notification]
label = "تنظیمات اعلان ها"
tooltip = "نمایش یا پنهان کردن اعلان ها."

  [freecam.config.notification.freecam]
  label = "اعلان های فری کم"
  tooltip = "وقتی به فری کم وارد یا از آن خارج می شوید به شما اطلاع می دهد."

  [freecam.config.notification.tripod]
  label = "اعلان های دوربین سه‌پایه"
  tooltip = "وقتی به دوربین سه‌پایه وارد یا از آن خارج می شوید به شما اطلاع می دهد."
