name: Publish to Modrinth

on:
  release:
    types: [published]

concurrency:
  group: modrinth-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Modrinth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir artifacts
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts

      - name: Validate release assets
        run: |
          test -f artifacts/release-metadata.json
          compgen -G 'artifacts/*.jar' >/dev/null

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Freecam Publisher
        uses: MinecraftFreecam/Publisher@c5fc4cecf816f5621a58cf54d45ded30dea2f164  # v0.0.4

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          echo "::notice::Using $(freecam-publish --version)"
          freecam-publish \
            --metadata artifacts/release-metadata.json \
            artifacts
